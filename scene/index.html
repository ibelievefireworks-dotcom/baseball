<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>今日の1場面｜配球を言葉にする</title>
<style>
  :root{
    --bg:#0b3d2e; --bg2:#0f5740; --card:#ffffff; --ink:#1a2a26;
    --muted:#6b7d77; --line:#e3eae7; --accent:#2e8b57; --accent2:#1f6b41;
    --gold:#e8b53b; --ok:#1f9d55; --okbg:#e8f7ee;
    --shadow:0 8px 30px rgba(0,0,0,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    color:var(--ink); background:linear-gradient(160deg,var(--bg),var(--bg2));
    min-height:100vh; min-height:100dvh; display:flex; justify-content:center;
    padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 12px);
  }
  .app{width:100%; max-width:560px; margin:auto 0;}
  .wrap{padding:18px 0 8px;}
  .brand{text-align:center; color:#fff; margin:14px 0 18px;}
  .brand .ball{font-size:40px; line-height:1; filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));}
  .brand h1{font-size:25px; margin:6px 0 2px; letter-spacing:.04em;}
  .brand p{margin:0; font-size:13px; opacity:.85;}
  .card{background:var(--card); border-radius:20px; box-shadow:var(--shadow); padding:20px; }
  h2.sec{font-size:15px; margin:2px 0 12px; color:var(--accent2); display:flex; align-items:center; gap:8px;}
  h2.sec::before{content:""; width:5px; height:18px; background:var(--gold); border-radius:3px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{border:1.5px solid var(--line); background:#fff; color:var(--ink); border-radius:999px;
    padding:8px 14px; font-size:13px; cursor:pointer; transition:.15s; user-select:none; font-weight:600;}
  .chip.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .goal{font-size:12.5px; color:var(--muted); margin:8px 2px 10px; line-height:1.7;}
  .btn{display:block; width:100%; border:0; border-radius:14px; cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
    font-size:18px; font-weight:800; padding:16px; margin-top:16px; letter-spacing:.04em;
    box-shadow:0 6px 16px rgba(31,107,65,.4); transition:.12s;}
  .btn:active{transform:translateY(1px);}
  .btn.lite{background:#fff;color:var(--accent2);border:2px solid var(--accent);box-shadow:none;}
  .topbar{display:flex; align-items:center; justify-content:space-between; color:#fff; margin:6px 2px 10px; font-size:13px;}
  .topbar .quit{background:rgba(255,255,255,.15); border:0; color:#fff; padding:6px 12px; border-radius:8px; font-size:12px; cursor:pointer;}
  .pbar{height:8px; background:rgba(255,255,255,.25); border-radius:99px; overflow:hidden; margin:0 2px 14px;}
  .pbar i{display:block; height:100%; background:var(--gold); width:0; transition:width .3s;}
  .qmeta{font-size:12px; color:var(--muted); margin-bottom:8px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .tag{background:#eef5f1; color:var(--accent2); border-radius:6px; padding:2px 8px; font-weight:700;}
  .badge-new{background:var(--accent); color:#fff; border-radius:6px; padding:2px 8px; font-weight:800; font-size:11px;}
  .badge-rev{background:var(--gold); color:#5a4410; border-radius:6px; padding:2px 8px; font-weight:800; font-size:11px;}
  .qtitle{font-size:18px; font-weight:800; line-height:1.4; margin:2px 0 10px;}
  .qscene{font-size:15.5px; line-height:1.7; background:#f6faf8; border:1px solid var(--line); border-left:5px solid var(--gold); border-radius:10px; padding:12px 14px; margin:4px 0 12px;}
  .qask{font-size:16.5px; font-weight:800; margin:4px 0 10px; color:var(--accent2); line-height:1.5;}
  .ta{width:100%; min-height:96px; border:2px solid var(--line); border-radius:12px; padding:12px; font-size:15px; line-height:1.6; font-family:inherit; resize:vertical; color:var(--ink);}
  .ta:focus{outline:none; border-color:var(--accent);}
  .ta:disabled{background:#f4f7f5; color:#4a5a55;}
  .explain{margin-top:14px; background:#f6faf8; border:1px solid var(--line); border-left:5px solid var(--accent); border-radius:10px; padding:12px 14px; font-size:14px; line-height:1.7; display:none;}
  .explain.show{display:block; animation:fade .25s;}
  .explain b{color:var(--accent2);}
  .explain .src{display:block; margin-top:7px; font-size:11.5px; color:var(--muted);}
  .prevans{margin-top:12px; background:#fff7e6; border:1px solid #f0dca8; border-radius:10px; padding:10px 12px; font-size:13.5px; line-height:1.7;}
  .prevans b{color:#8a6410;}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  .result{text-align:center;}
  .result .big{font-size:52px; margin:6px 0 2px;}
  .rmsg{font-size:18px; font-weight:800; margin:6px 0 2px;}
  .rsub{font-size:14px; color:var(--muted); margin-bottom:6px;}
  .foot{text-align:center; color:rgba(255,255,255,.6); font-size:11px; margin:16px 0 4px; line-height:1.7;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="app"><div class="wrap">
  <div class="brand">
    <div class="ball">⚾</div>
    <h1>今日の1場面</h1>
    <p>配球を"自分の言葉"で説く練習（10月チャレンジ）</p>
  </div>

  <div id="start" class="card">
    <h2 class="sec">プレイヤー</h2>
    <div class="chips" id="profChips"></div>
    <div class="goal" id="todayCard" style="margin-top:12px;"></div>
    <button class="btn hidden" id="startBtn">▶</button>
    <button class="btn lite hidden" id="shareTop" style="font-size:14px;padding:11px;">📤 今日の答えを父上にLINEで送る</button>
    <div class="goal" style="margin-top:14px;">やり方：試合の場面を読んで、<b>自分ならどう配球するか・なぜか</b>を書く → 「模範の考え方」と見比べる。正解は一つじゃない。根拠を言葉にできたら勝ち。<br>毎日：<b>新規2＋前日の復習2＝4場面</b>。</div>
    <div style="text-align:center;margin-top:12px;"><a href="../" style="color:#8aa094;font-size:12px;">📚 配球クイズ（選択式）へ</a></div>
  </div>

  <div id="quiz" class="card hidden">
    <div class="topbar"><span id="qprog"></span><button class="quit" id="quitBtn">中断</button></div>
    <div class="pbar"><i id="pbar_i"></i></div>
    <div class="qmeta"><span id="qbadge" class="badge-new">新規</span><span class="tag" id="qtag"></span></div>
    <div class="qtitle" id="qtitle"></div>
    <div class="qscene" id="qscene"></div>
    <div class="qask" id="qask"></div>
    <textarea class="ta" id="ta" placeholder="自分ならどう配球する？ なぜそうする？ 思ったことを書いてみよう。"></textarea>
    <div class="prevans hidden" id="prevWrap"></div>
    <div class="explain" id="explain"></div>
    <button class="btn" id="revealBtn">書けたら → 模範と見比べる</button>
    <button class="btn hidden" id="nextBtn">次へ ▶</button>
  </div>

  <div id="result" class="card result hidden">
    <div class="big">🎉</div>
    <div class="rmsg" id="rTitle"></div>
    <div class="rsub" id="rSub"></div>
    <div class="goal" id="rMsg" style="text-align:center;"></div>
    <button class="btn" id="shareBtn2">📤 今日の答えを父上にLINEで送る</button>
    <button class="btn lite" id="homeBtn" style="margin-top:8px;">トップへもどる</button>
  </div>

  <div class="foot">配球に唯一の正解はない。大事なのは「根拠を持って選べたか」。<br>出典：野村ノート／工藤／落合／ほか配球本</div>
</div></div>

<script>
const $=id=>document.getElementById(id);
const PROFILES=["莉映","父上","母上"];
const START=new Date(2026,9,13);   // 2026-10-13 開幕
const NEWPD=2;                      // 1日の新規場面数（復習も同数）
const pd=new URLSearchParams(location.search).get("d"); // テスト用 ?d=2026-10-20
const NOW=pd?new Date(pd+"T12:00:00"):new Date();
function dayIndex(){ const d0=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()); return Math.round((d0-START)/86400000)+1; }
const DAY=dayIndex();

/* ==== 場面バンク（全36・師匠は1場面ごとに固定／模範は有力な考え方） ==== */
const SCENES=[
 {s:"野村",t:"初球の入り方",sc:"1回表0-0、相手1番（足が速く出塁型・長打は少ない）。初球。",q:"どんな狙いで初球を入れる？",m:"1番は塁に出たい打者。四球が一番まずい→ストライク先行。ただし甘いと出塁型は見逃さない。外角でカウントを取りにいき、その日の積極性（振ってくるか）を測る。走られる前提で速球系から。",src:"野村ノート（リードの基本・打順の性質）"},
 {s:"野村",t:"追い込んでから",sc:"2ストライクに追い込んだ。相手は長打のある4番。",q:"決め球をどう考える？",m:"追い込んだら主導権は捕手側。最悪なのは置きにいった甘い球。ボール1つ使える有利カウント＝ゾーンから出ていく変化球や、見せ球の逆で空振りを狙う。真ん中に集めない。",src:"野村ノート（カウント別の主導権・勝負球）"},
 {s:"落合",t:"痛打された球の次",sc:"前の打席、この打者に外角スライダーを右中間へ痛打された。2打席目。",q:"さっき痛打されたスライダーをどう扱う？",m:"良い打者は痛打した球を来ると待つ。同じ球を同じ所へは放らない。ただし封印ではなく見せ球にして意識を残し、逆（内の速球・高さ違い）で仕留める。打者は成功体験を引きずる。",src:"落合『バッティングの理屈』（打者の狙いと対処）"},
 {s:"工藤",t:"投手が崩れかけ",sc:"味方投手がイライラして雑に。四球→長打のピンチ。",q:"次の1球の前に捕手は何をする？",m:"まず間を作る。立つ・一歩出る等でリズムを切り、呼吸を整えさせる。球種より先に気持ちの入った球を取り戻させる。球はシンプルに、本人が一番自信のある球から。",src:"工藤（捕手の心と技）／落合（気持ちの入らない球は見破られる）"},
 {s:"実戦",t:"1点差9回一死三塁",sc:"1点リードの9回裏、一死三塁、内野前進。打者は右の中距離。",q:"組み立ての方針は？",m:"犠飛と内野ゴロ（スクイズ/ゴロGO）の両にらみ。外角低め中心で上げさせない・引っ張らせない。高めの甘い球が犠飛で一番危険。フォークは暴投＝即失点なので三塁走者ありではブロック技術と相談。",src:"実戦（複合シナリオ）"},
 {s:"IQドリル",t:"振り逃げの場面",sc:"2アウト2ストライク、低めの変化球をワンバウンドで捕球。打者は空振り、一塁は空いている。",q:"捕球直後、何を確認してどう動く？",m:"2アウト・一塁空き＝振り逃げ成立。確実に一塁へ送球かタッチ。打者がダートサークルを出れば走塁放棄でアウト。三振＝チェンジと気を抜かない。",src:"IQドリル（捕手のルール知識）"},
 {s:"野村",t:"不利なカウント2-0",sc:"カウント2-0（打者有利）。打者は早打ちで引っ張り。",q:"不利なカウントをどう逃げる？",m:"置きにいくと長打。引っ張り打者が待つ内〜真ん中を外し、外角のボールゾーンから入る球で1つ取り返す＝狙いの逆。カウントを戻せば主導権も戻る。",src:"野村ノート（カウント別・狙い外し）"},
 {s:"落合",t:"立ち位置が変わった",sc:"打者がいつもよりベースに近く、やや前に立った。",q:"立ち位置から何を読み、どう攻める？",m:"近く・前＝外角を踏み込んで狙う／速球に差し込まれたくない意思。内角を厳しく見せて踏み込みを消し、外角の出し入れで泳がせる。立ち位置は狙いの告白。",src:"落合『バッティングの理屈』（立ち位置とスタンスの読み）"},
 {s:"工藤",t:"ブルペンと試合は別",sc:"ブルペンで絶不調だった先発。だが初回を三者凡退。",q:"2回以降、捕手としてどう考える？",m:"ブルペンと試合は別物。初回の内容で何が良くて何が悪いかをもう一度見極め、シミュレーションを組み直す。思い込みで配球を固定しない。",src:"工藤（捕手の心と技）"},
 {s:"極意",t:"技巧派の先発",sc:"エースではないが制球のいい技巧派が先発。",q:"この投手で勝つ組み立ては？",m:"球威で押せない投手こそ見せ球と勝負球の組み合わせで的を絞らせない。球速でなくコース・緩急・出し入れ。制球力＝配球の幅。",src:"極意（配球の考え方）"},
 {s:"実戦",t:"フォーク狙いの4番",sc:"相手4番は今日フォークに3三振。だがまだフォークを待つ素振り。",q:"次の打席、フォークをどう使う？",m:"待っている球は見せ球に。フォークを匂わせ、真っ直ぐ/別球で仕留める。良い打者は三振した球をマークするので逆を突く。",src:"実戦（ペア×打者心理）"},
 {s:"IQドリル",t:"スクイズを許した直後",sc:"スクイズで1失点。二塁に走者が残り、守備が浮足立つ。",q:"次の1球までに締めること・方針は？",m:"1点で止めるか2点になるかは締めの動き。緩慢な送球で二塁走者を還すツーランスクイズの危険を全員で確認。ここで四球・暴投を足さず、確実にゾーンへ。",src:"IQドリル（作戦とセオリー）"},
 {s:"野村",t:"自分の配球で痛打された",sc:"自分のリードで痛打され、ベンチで悩む。",q:"正しい配球だったかをどう振り返る？",m:"配球に唯一の正解はない。大事なのは根拠を持って選んだか。結果だけで良し悪しを決めない（結果論に逃げない）。なぜその球を選んだかの言語化が次に活きる。",src:"野村ノート（配球の本質）"},
 {s:"落合",t:"目の錯覚を使う",sc:"速球派投手。打者が差し込まれ気味に見える。",q:"錯覚をどう利用する？",m:"速球を見せた後の緩い球は体感でさらに遅く、速球はさらに速く感じる。速球で目を慣らし、緩急で狂わせる＝打者の見え方を操作する。",src:"落合『バッティングの理屈』（目の錯覚と打者の見方）"},
 {s:"科学",t:"構え・的の示し方",sc:"制球に不安のある投手。",q:"捕手の構え（ミットの出し方）で何を助けられる？",m:"早く大きな的を見せすぎず、ギリギリまで的を動かさず明確に示す。投げやすいリズムと明確なターゲットを作るのも捕手の技術。",src:"キャッチャーの科学（キャッチング）"},
 {s:"リード術",t:"空振りを取った直後",sc:"変化球で空振りを取った直後。",q:"次の1球、何が成功率が高い？",m:"逆を突く。良い打者は空振りした変化球を次マークする。真っ直ぐ→もう一球真っ直ぐが逆を突けて成功率が高い（同じ変化球の連投は待たれやすい）。",src:"リード術（上級編）"},
 {s:"工藤",t:"データのない初戦",sc:"データのない新チームとの初戦。相手の中軸。",q:"情報が無いとき、何を手掛かりに配球する？",m:"その打席の反応を情報に変える。初球〜2球で踏み込み・振り出し・見逃し方を観察し、構えとファウルの方向から狙いを推測。無ければ作る＝自分で情報を取りにいく。",src:"工藤（捕手の心と技）"},
 {s:"実戦",t:"歩かせるか勝負か",sc:"1点差、二死二塁、相手の主砲。次打者は当たっていない。",q:"歩かせるか勝負か、どう投げるか？",m:"次打者勝負も作戦。だが中途半端が最悪＝歩かせるなら明確に、勝負なら甘く入れない覚悟で。二塁走者なので四球でも一塁が埋まるだけ。次打者の状態と割り切りで決める。",src:"実戦（複合シナリオ）"},
 {s:"野村",t:"球が高めに浮く日",sc:"同じ投手でも日によって走る球が違う。今日は高めに浮く。",q:"浮く日、組み立てをどう変える？",m:"その日の状態に合わせる。低めを丁寧に要求しつつ、浮いた高めは見せ球（釣り球）と割り切って使う。状態の悪い球を無理に勝負球にしない。",src:"野村ノート（観察・その日の球）"},
 {s:"落合",t:"タイミングが合う打者",sc:"打者がどの球にもジャストミートしてくる。",q:"合っている打者をどう外す？",m:"球種より間合い・リズムを変える。クイック/ゆるめ、投球間隔、同じ球でも緩急。合う＝打者のリズム通り。そのリズムを壊す。",src:"落合『バッティングの理屈』（タイミングと打者）"},
 {s:"工藤",t:"満塁フルカウント",sc:"満塁3-2。投手の変化球は今日制球が甘い。",q:"フルカウント、何を投げさせる？",m:"押し出しが最悪。甘い変化球でボールを出すより、今日一番ストライクが取れる球（多くは直球）で正面から。自信のある球＋気持ちの入った球。",src:"工藤（捕手の心と技）／落合（気持ち）"},
 {s:"実戦",t:"俊足走者一塁",sc:"俊足走者が一塁。打者は右で流し打ちもできる。",q:"盗塁警戒と打者攻略を両立するには？",m:"速球系とクイックで走者を抑えつつ、外一辺倒は盗塁を助ける（送球しやすい外に偏ると読まれる）ので配分注意。走者と打者の優先度を1球ごとに天秤。",src:"実戦（複合シナリオ）"},
 {s:"IQドリル",t:"二死二塁でフォーク",sc:"二死・走者二塁、2ストライク。ワンバウンドしうるフォークを使いたい。",q:"この状況でフォークを要求してよい？",m:"二死なら振り逃げ・暴投リスクを天秤に。走者二塁＝暴投で三塁だが致命傷ではない。空振り奪取の価値と暴投リスクを比較し、ブロックに自信があれば可。盲目的に使わない。",src:"IQドリル（状況判断）"},
 {s:"極意",t:"見せ球の意味",sc:"初球をわざとボールゾーンに外した。",q:"その見せ球の狙いを説明できる？",m:"見せ球は次を活かす布石。打者の反応を見る／意識を特定コースに置く／勝負球を引き立てる。意味のない1球にしない＝全球に理由。",src:"極意（見せ球と勝負球）"},
 {s:"リード術",t:"連打を止める",sc:"連打でリズムが相手に傾いた。次打者へ。",q:"流れを切る1球目は？",m:"連打は多く同じ失投の繰り返しから。まず入りを変える（コース・球種・高さ）。前の打者と同じ入りを避け、ストライク先行で主導権を取り戻す。",src:"リード術"},
 {s:"科学",t:"審判が低めを取らない日",sc:"際どい低め、審判が取ってくれない日。",q:"捕手として何を変える？",m:"捕球の仕方（ミットの流れ・止め方）でストライクに見せる技術。同じ球でも捕り方で判定は変わる。審判の傾向に合わせて要求コースも微調整。",src:"キャッチャーの科学（キャッチング）"},

/* ==== 日程（新規2＋前日の復習2／日付シードで3人共通） ==== */
function mulberry(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function seededShuffle(a,seed){ a=a.slice(); const r=mulberry(seed); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t; } return a; }
const SORDER=seededShuffle(SCENES.map((_,i)=>i), 20261013); // 師匠を散らす固定順
function newIdxs(d){ if(d<1) return []; const base=((d-1)*NEWPD)%SORDER.length; const out=[]; for(let k=0;k<NEWPD;k++) out.push(SORDER[(base+k)%SORDER.length]); return out; }
function reviewIdxs(d){ return d>=2 ? newIdxs(d-1) : []; }
function dayItems(d){ const items=[]; reviewIdxs(d).forEach(i=>items.push({i:i,mode:"rev"})); newIdxs(d).forEach(i=>items.push({i:i,mode:"new"})); return items; }

/* ==== プレイヤー記録（キー分離） ==== */
let profile=localStorage.getItem("scene_profile")||"";
if(PROFILES.indexOf(profile)<0) profile="";
function loadJ(k,def){ try{ const v=JSON.parse(localStorage.getItem(k)); return (v===null||v===undefined)?def:v; }catch(e){ return def; } }
function log(){ return loadJ("scene_log_"+profile,{}); }
function saveLog(o){ try{ localStorage.setItem("scene_log_"+profile,JSON.stringify(o)); }catch(e){} }
function ansAll(){ return loadJ("scene_ans_"+profile,{}); }
function saveAns(o){ try{ localStorage.setItem("scene_ans_"+profile,JSON.stringify(o)); }catch(e){} }
function cur(){ return loadJ("scene_cur_"+profile,null); }
function saveCur(o){ try{ localStorage.setItem("scene_cur_"+profile,JSON.stringify(o)); }catch(e){} }
function delCur(){ try{ localStorage.removeItem("scene_cur_"+profile); }catch(e){} }
function streak(){ const L=log(); let d=DAY; if(!L[d]) d--; let n=0; while(d>=1&&L[d]){ n++; d--; } return n; }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>"); }

/* ==== セッション ==== */
let S=null;
function startDay(){
  if(!profile||DAY<1) return;
  if(log()[DAY]) return;
  const items=dayItems(DAY); if(!items.length) return;
  let c=cur(); let pos=(c&&c.day===DAY)?(c.pos||0):0;
  saveCur({day:DAY,pos:pos});
  S={items:items,pos:pos};
  show("quiz"); renderItem();
}
function renderItem(){
  const it=S.items[S.pos], sc=SCENES[it.i];
  $("qprog").textContent=(S.pos+1)+" / "+S.items.length+"場面";
  $("pbar_i").style.width=(S.pos/S.items.length*100)+"%";
  $("qbadge").className=it.mode==="new"?"badge-new":"badge-rev";
  $("qbadge").textContent=it.mode==="new"?"新規":"復習（昨日の問題）";
  $("qtag").textContent="師匠："+sc.s;
  $("qtitle").textContent=sc.t;
  $("qscene").textContent=sc.sc;
  $("qask").textContent=sc.q;
  const a=ansAll(); const saved=(a[it.i]&&a[it.i][DAY])||"";
  const ta=$("ta"); ta.value=saved; ta.disabled=false;
  $("explain").classList.remove("show"); $("explain").innerHTML="";
  $("prevWrap").classList.add("hidden"); $("prevWrap").innerHTML="";
  $("revealBtn").classList.remove("hidden");
  $("nextBtn").classList.add("hidden");
  window.scrollTo(0,0);
}
function reveal(){
  const it=S.items[S.pos], sc=SCENES[it.i], ta=$("ta");
  if(!ta.value.trim() && !confirm("まだ書いていないよ。先に自分の考えを書こう！ それでも模範を見る？")) return;
  const a=ansAll(); if(!a[it.i]) a[it.i]={}; a[it.i][DAY]=ta.value.trim(); saveAns(a);
  ta.disabled=true;
  $("explain").innerHTML="<b>模範の考え方</b><br>"+sc.m+'<span class="src">出典の目安：'+sc.src+"</span>";
  $("explain").classList.add("show");
  if(it.mode==="rev"){
    const prev=(a[it.i]&&a[it.i][DAY-1])||"";
    if(prev){ $("prevWrap").innerHTML="<b>昨日の自分の答え</b><br>"+esc(prev); $("prevWrap").classList.remove("hidden"); }
  }
  $("revealBtn").classList.add("hidden");
  $("nextBtn").classList.remove("hidden");
}
$("revealBtn").onclick=reveal;
$("nextBtn").onclick=()=>{
  S.pos++; saveCur({day:DAY,pos:S.pos});
  if(S.pos>=S.items.length){ finishDay(); return; }
  renderItem();
};
function finishDay(){
  const L=log(); L[DAY]={date:(NOW.getMonth()+1)+"/"+NOW.getDate(),done:true}; saveLog(L); delCur();
  $("rTitle").textContent="第"+DAY+"日 完了！";
  $("rSub").textContent="🔥 連続"+streak()+"日";
  $("rMsg").textContent="今日の4場面、自分の言葉にできたね。答えは一つじゃない——「なぜそうするか」を言えたことが力になる。";
  show("result");
  if(navigator.share){ try{ doShare(); }catch(e){} }
}

/* ==== 共有（今日の新規の答えを父上へ） ==== */
function doShare(){
  const a=ansAll(), ni=newIdxs(DAY);
  let body="⚾今日の1場面 第"+DAY+"日｜"+profile+"（🔥連続"+streak()+"日）\n";
  ni.forEach(i=>{ const sc=SCENES[i]; const t=(a[i]&&a[i][DAY])||"（未記入）"; body+="\n【"+sc.t+"】\n"+t+"\n"; });
  body+="\n"+location.origin+location.pathname;
  if(navigator.share){ navigator.share({text:body}).catch(function(){}); return; }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(body).then(function(){ alert("今日の答えをコピーしました！LINEに貼り付けてね"); }).catch(function(){ prompt("コピーしてLINEで送ってね",body); });
  } else prompt("コピーしてLINEで送ってね",body);
}

/* ==== トップ・画面制御 ==== */
function renderStart(){
  const pc=$("profChips"); pc.innerHTML="";
  PROFILES.forEach(p=>{
    const el=document.createElement("div");
    el.className="chip"+(p===profile?" on":"");
    el.textContent="👤 "+p;
    el.onclick=()=>{ profile=p; localStorage.setItem("scene_profile",p); renderStart(); };
    pc.appendChild(el);
  });
  const t=$("todayCard"), btn=$("startBtn");
  btn.classList.add("hidden"); $("shareTop").classList.add("hidden");
  if(!profile){ t.innerHTML="👤 だれがやるか選んでね（記録は別々）"; }
  else if(DAY<1){ t.innerHTML="⚾ 10/13 開幕！ おたのしみに"; }
  else{
    const L=log(), ni=newIdxs(DAY), ri=reviewIdxs(DAY), tot=ni.length+ri.length;
    const dateStr=(NOW.getMonth()+1)+"/"+NOW.getDate();
    const head="📅 <b>"+dateStr+"（第"+DAY+"日）</b>　新規"+ni.length+" ＋ 復習"+ri.length+" ＝ "+tot+"場面";
    if(L[DAY]){
      t.innerHTML=head+"<br><b>✅ 本日クリア！</b>　🔥連続"+streak()+"日";
      $("shareTop").classList.remove("hidden");
    }else{
      const c=cur(); const resumed=c&&c.day===DAY&&c.pos>0;
      t.innerHTML=head+(streak()>0?"　🔥連続"+streak()+"日中":"");
      btn.textContent=resumed?("▶ つづきから（"+(c.pos+1)+"場面目）"):("▶ 今日の"+tot+"場面を始める");
      btn.classList.remove("hidden");
    }
  }
}
$("startBtn").onclick=startDay;
$("shareTop").onclick=doShare;
$("shareBtn2").onclick=doShare;
$("quitBtn").onclick=()=>{ if(S) saveCur({day:DAY,pos:S.pos}); if(confirm("中断しますか？（ここまでの答えは保存され、つづきから再開できます）")){ show("start"); renderStart(); } };
$("homeBtn").onclick=()=>{ show("start"); renderStart(); };
function show(w){ ["start","quiz","result"].forEach(id=>$(id).classList.toggle("hidden",id!==w)); window.scrollTo(0,0); }
renderStart();
</script>
